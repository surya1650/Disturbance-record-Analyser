  - id: C854-SOURCE-CAUTIONS
    source_id: cigre-tb854
    locator: "Table 1 page 10; equation 7 page 11; equation 8 page 12; Table 5 page 25; Table 6 pages 32-33; Figures 45/48 pages 49-50"
    asset_types: [line]
    topics: [source-cautions, compensation, validation, units]
    analyzer_state: catalogued
    summary: "Extraction review: apparent inconsistencies in the supplied copy require care before copying formulas or benchmarks."
    rules:
      - "Project observation, not published errata: Table 1 uses k0*I0 while defining k0=(Z0-Z1)/(3*Z1) and I0 as sequence current. Our convention requires k0*(3*I0)."
      - "Implementation distinction: equation 7 uses magnitude bars; our E4 deliberately retains the real part and imaginary residual."
      - "Table 5's first DFR table-parameter row lists 65.8 km versus 60.8 km but prints 6.0 km error; subtraction gives 5.0 km."
      - "Table 6 step 2 prints remote current 1496 A where the prose uses 1946 A; only the latter fits its stated ratio. Its halving sequence is bisection-style despite the golden-search caption."
      - "The page 33 example's 0.55 km error is approximately 0.214 percent of the 256.8 km line; the reported 0.475 percent corresponds to the 115.9 km fault-distance denominator."
      - "Page 49 names terminal Y for the 19.0 mile junction while Table 8 ordering and Figure 48 place it from X. Resolve the reference before constructing a numerical oracle."
      - "Detailed derivations, applicability decisions and visual-review findings are recorded in project-docs/CIGRE_TB854_METHODS.md."

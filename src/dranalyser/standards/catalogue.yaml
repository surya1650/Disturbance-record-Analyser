  - id: RLD-FORMULA
    source_id: load-encroachment-workbook
    locator: "Sheet1, calculation blocks E4:Q13"
    asset_types: [line]
    topics: [distance.load-encroachment, calculation]
    analyzer_state: active
    summary: "Workbook calculation reproduced by the analyzer."
    rules:
      - "Base load impedance is ((0.85 x nominal kV)^2 x cos(30 degrees)) / (1.5 x governing MVA rating)."
      - "Safety factor is cos(load angle + 90 degrees - line angle) / cos(90 degrees - line angle)."
      - "Minimum primary reach is base load impedance times the safety factor."
      - "Secondary reach is primary reach divided by the VT-ratio/CT-ratio impedance conversion factor."
      - "Use the lower of conductor thermal MVA and bay-equipment MVA when both are known."

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dranalyser"
version = "0.1.0"
description = "Two-ended disturbance record analyser for distance protection relays"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "R. Surya" }]
keywords = ["comtrade", "fault-location", "distance-protection", "power-systems"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
# segno renders the ground-truth QR code; without it the report prints the
# URL instead. Deliberately optional: a silently wrong QR is worse than none.
report = ["segno>=1.6"]
dev = ["pytest>=7.4", "scikit-learn>=1.3", "Jinja2>=3.1"]

[project.scripts]
dranalyse = "dranalyser.cli:main"

[tool.setuptools]
# src-layout: required for `pip install -e .` to find the package.
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dranalyser = ["standards/*.yaml", "rules/*.yaml", "report/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]
exclude = [
    ".venv",
    "dr",            # legacy streamlit prototype, not part of the project
    "DR1",           # legacy scaffold
    "DR 9-4-2026",
    "DR & Events 9-4-2026",
    "build",
    "dist",
]

[tool.ruff.lint]
# Same rule set as the AHI portal: pycodestyle errors, pyflakes, bugbear.
# The codebase deliberately uses compact one-line statements; do not add style rules
# that fight that.
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: trains a model; deselect with -m 'not slow'",
    "corpus: needs real vendor COMTRADE files (skips cleanly when absent)",
]
filterwarnings = ["ignore::DeprecationWarning"]
